name: Sign iOS Shortcuts

# iOS imports only signed .shortcut files, and only macOS can sign them. When the generator changes on a branch,
# this builds «Элвис вход» / «Элвис выход» (scripts/shortcuts/build.mjs), signs them on a macOS runner and commits
# the signed files to apps/web/public/shortcuts/ on the same branch. The files hold no personal data.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/shortcuts/**'
      - '.github/workflows/shortcuts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/shortcuts/build.mjs build/shortcuts
      - name: Sign
        run: |
          sw_vers
          mkdir -p apps/web/public/shortcuts
          for name in elvis-open elvis-close; do
            plutil -lint "build/shortcuts/$name.plist"
            plutil -convert binary1 -o "build/shortcuts/$name.unsigned.shortcut" "build/shortcuts/$name.plist"
            shortcuts sign --mode anyone --input "build/shortcuts/$name.unsigned.shortcut" --output "apps/web/public/shortcuts/$name.shortcut"
            ls -l "apps/web/public/shortcuts/$name.shortcut"
          done
      - name: Commit the signed files
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/shortcuts
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Sign iOS Shortcuts (Элвис вход / выход)"
          git push
