name: D1 SQL (admin)

# Run a one-off SQL statement against the production D1 database (Actions → D1 SQL → Run workflow).
on:
  workflow_dispatch:
    inputs:
      sql:
        description: 'SQL to execute'
        required: true
        type: string

jobs:
  sql:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve D1 id
        working-directory: apps/worker
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="tracker-db") | .uuid')
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.jsonc
      - name: Execute
        working-directory: apps/worker
        run: |
          npx wrangler d1 execute tracker-db --remote --command "${{ inputs.sql }}" --json | tee out.json
          echo "::notice::$(jq -c '.[0].results // .[0].meta' out.json | cut -c1-900)"
