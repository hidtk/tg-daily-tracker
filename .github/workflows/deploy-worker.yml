name: Deploy (Worker + Mini App)

# Zero-touch deploy. Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — "Edit Cloudflare Workers" template + D1 Edit
#   BOT_TOKEN             — from @BotFather
#   SESSION_SECRET        — any long random string
# Optional secrets: CLOUDFLARE_ACCOUNT_ID (auto-detected), D1_DATABASE_ID (auto-created by name),
#   ANTHROPIC_API_KEY (turns on the AI opinion on Writing texts), SENTENCE_JUDGE_TOKEN (bearer for an own model)
# Optional variables: BOT_USERNAME (without @) — read from Telegram when unset;
#   SENTENCE_JUDGE — who checks the meaning of sentences: none (default) | workers-ai | http;
#   SENTENCE_JUDGE_URL, SENTENCE_JUDGE_MODEL (http: an OpenAI-compatible /v1/chat/completions of your own model);
#   WORKERS_AI_DAILY_CAP (default 100, never above 200 — well inside the free Workers AI allowance)
# SESSION_SECRET: letters, digits, _ and - only (it doubles as the webhook secret), e.g. openssl rand -hex 32

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_JUDGE_TOKEN: ${{ secrets.SENTENCE_JUDGE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Mini App
        run: npm run build

      - name: Resolve Cloudflare account id
        id: acct
        run: |
          ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$ID" ]; then
            RESP=$(curl -s -w '\nHTTP %{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts || true)
            echo "::warning::accounts API response: $(echo "$RESP" | tr -d '\n' | cut -c1-600)"
            ID=$(echo "$RESP" | head -1 | jq -r '.result[0].id // empty' 2>/dev/null || true)
          fi
          if [ -z "$ID" ]; then
            echo "::error::Cannot resolve Cloudflare account id. Check CLOUDFLARE_API_TOKEN permissions (needs Account Settings:Read, Workers Scripts:Edit, D1:Edit) or set CLOUDFLARE_ACCOUNT_ID secret."
            npx wrangler whoami || true
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Ensure D1 database exists
        id: d1
        working-directory: apps/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
        run: |
          ID="${{ secrets.D1_DATABASE_ID }}"
          if [ -z "$ID" ]; then
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="tracker-db") | .uuid')
          fi
          if [ -z "$ID" ]; then
            npx wrangler d1 create tracker-db
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="tracker-db") | .uuid')
          fi
          [ -n "$ID" ] || { echo "Cannot resolve D1 id"; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$ID/" wrangler.jsonc
          npx wrangler d1 migrations apply tracker-db --remote

      - name: Ensure workers.dev subdomain
        env:
          ACCT: ${{ steps.acct.outputs.id }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/subdomain"
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          CUR=$(curl -s -H "$H" "$API" | jq -r '.result.subdomain // empty')
          if [ -n "$CUR" ]; then echo "workers.dev subdomain: $CUR"; exit 0; fi
          for NAME in "${{ github.repository_owner }}" "${{ github.repository_owner }}-tracker" "${{ github.repository_owner }}-$RANDOM"; do
            NAME=$(echo "$NAME" | tr 'A-Z' 'a-z')
            RESP=$(curl -s -X PUT -H "$H" -H 'content-type: application/json' "$API" -d "{\"subdomain\":\"$NAME\"}")
            if [ "$(echo "$RESP" | jq -r .success)" = "true" ]; then echo "registered workers.dev subdomain: $NAME"; exit 0; fi
            echo "::warning::subdomain $NAME rejected: $(echo "$RESP" | jq -c .errors)"
          done
          echo "::error::Could not register a workers.dev subdomain. Register one in the Cloudflare dashboard (Workers & Pages → Overview) and re-run."
          exit 1

      - name: Resolve bot username
        id: bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          NAME="${{ vars.BOT_USERNAME }}"
          if [ -z "$NAME" ] && [ -n "$BOT_TOKEN" ]; then
            NAME=$(curl -s "https://api.telegram.org/bot$BOT_TOKEN/getMe" | jq -r '.result.username // empty')
          fi
          [ -n "$NAME" ] || echo "::warning::BOT_USERNAME is not set and could not be read from Telegram; partner links will not work."
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Sentence judge (optional, default none)
        id: judge
        working-directory: apps/worker
        env:
          JUDGE: ${{ vars.SENTENCE_JUDGE }}
          JUDGE_URL: ${{ vars.SENTENCE_JUDGE_URL }}
          JUDGE_MODEL: ${{ vars.SENTENCE_JUDGE_MODEL }}
          AI_CAP: ${{ vars.WORKERS_AI_DAILY_CAP }}
        run: |
          ARGS="--var SENTENCE_JUDGE:${JUDGE:-none}"
          if [ -n "$JUDGE_URL" ]; then ARGS="$ARGS --var SENTENCE_JUDGE_URL:$JUDGE_URL"; fi
          if [ -n "$JUDGE_MODEL" ]; then ARGS="$ARGS --var SENTENCE_JUDGE_MODEL:$JUDGE_MODEL"; fi
          if [ -n "$AI_CAP" ]; then ARGS="$ARGS --var WORKERS_AI_DAILY_CAP:$AI_CAP"; fi
          if [ "$JUDGE" = "workers-ai" ]; then
            # The Workers AI binding is added only when asked for. If the deploy then fails with an auth error,
            # add "Workers AI — Read" (Account) to CLOUDFLARE_API_TOKEN.
            sed -i 's#"observability": { "enabled": true },#"observability": { "enabled": true },\n  "ai": { "binding": "AI" },#' wrangler.jsonc
            grep -q '"ai": { "binding": "AI" }' wrangler.jsonc
          fi
          echo "::notice::Sentence judge: ${JUDGE:-none}"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        id: deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
        run: |
          set +e
          npx wrangler deploy --var BOT_USERNAME:"${{ steps.bot.outputs.name }}" ${{ steps.judge.outputs.args }} 2>&1 | tee deploy.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" != "0" ]; then
            echo "::error::wrangler deploy failed: $(grep -iE 'error|✘|X \[' deploy.log | tr -d '\n' | cut -c1-900)"
            exit 1
          fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed to $URL"
          # WEBAPP_URL is needed by cron messages (no request origin there); set it now that we know the URL.
          npx wrangler deploy --var BOT_USERNAME:"${{ steps.bot.outputs.name }}" --var WEBAPP_URL:"$URL" ${{ steps.judge.outputs.args }} > /dev/null

      - name: Set Worker secrets
        if: env.HAS_BOT_TOKEN == 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
        run: |
          printf '%s' "${{ secrets.BOT_TOKEN }}" | npx wrangler secret put BOT_TOKEN
          printf '%s' "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET

      - name: Set the AI key (optional)
        if: env.HAS_ANTHROPIC_KEY == 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY

      - name: Set the sentence judge token (optional)
        if: env.HAS_JUDGE_TOKEN == 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.acct.outputs.id }}
          SENTENCE_JUDGE_TOKEN: ${{ secrets.SENTENCE_JUDGE_TOKEN }}
        run: printf '%s' "$SENTENCE_JUDGE_TOKEN" | npx wrangler secret put SENTENCE_JUDGE_TOKEN

      - name: Configure Telegram bot (webhook, menu button, commands)
        if: env.HAS_BOT_TOKEN == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: node scripts/setup-bot.mjs "${{ steps.deploy.outputs.url }}"
